name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # macOS runner minutes bill at a multiple of Linux, so the iOS build only
  # runs when a push/PR actually touches Swift/Xcode files. GitHub Actions
  # has no native per-job `paths:` filter (that key only gates whole
  # workflows), so this job computes the equivalent itself from `git diff`
  # against the two commits GitHub already gives us for each event type.
  #
  # `swift-test` is gated the same way for a different reason: no job in this
  # repo has ever run on a runner image with a Swift toolchain, so if
  # `ubuntu-latest` ships no `swift` the failure should land on Swift PRs
  # only, not on every PR to main.
  changes:
    name: detect Swift/Xcode changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/main"
          else
            base="$BEFORE_SHA"
          fi

          changed=$(git diff --name-only "$base" HEAD 2>/dev/null || true)
          echo "$changed"

          if echo "$changed" | grep -qE '^(shared/swift/|pulse/ios/|\.github/workflows/ci-swift\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  swift-test:
    name: swift test (OSNShared)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain info
        run: swift --version

      - name: swift test
        working-directory: shared/swift/OSNShared
        run: swift test

  ios-build:
    name: xcodegen + xcodebuild (Pulse)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode / SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | head

      - name: xcodegen generate
        working-directory: pulse/ios
        run: xcodegen generate

      - name: xcodebuild
        working-directory: pulse/ios
        run: |
          xcodebuild -scheme Pulse \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
