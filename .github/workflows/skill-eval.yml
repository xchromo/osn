name: Skill Eval

# The inner loop for `.claude/skills/`. Two gates, and they are different kinds
# of thing.
#
# `quality` is deterministic and cheap: Tessl reviews the SKILL.md files the
# diff touched and scores their structure. It fails the check.
#
# `eval` is neither. It runs the changed skills' scenarios through a real agent
# and scores what the agent leaves on disk, which costs credits and swings
# between identical runs — at `-n 1` a scenario's score moves further on noise
# than most real regressions do. So it never fails the check. It posts a table
# against the committed scoreboard and leaves the judgement to a person.
on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".claude/evals/**"
      # The scoreboard is written BY this workflow. Watching it would make
      # every run trigger the next one.
      - "!.claude/evals/scores.json"
      - "scripts/skill-evals.ts"
      - ".github/workflows/skill-eval.yml"

# A force-push mid-run otherwise leaves the first run going and starts a
# second, and both are billed.
concurrency:
  group: skill-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Skill quality review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Third-party, so both tesslio actions here are pinned to a commit rather
      # than a moving tag, unlike the well-known actions this repository takes
      # on a version tag. `setup-tessl` matters most of the two: it is handed
      # `secrets.TESSL_TOKEN`, and a moving tag means whoever can move it can
      # read that secret.
      - name: Review changed SKILL.md files
        uses: tesslio/skill-review@7e7ea574722a6d72752aa5a316bcc813d06b7cd2
        with:
          path: .claude/skills
          comment: "true"
          fail-threshold: "70"
          workspace: musubi
          tessl-token: ${{ secrets.TESSL_TOKEN }}

  eval:
    name: Scenario eval
    needs: quality
    runs-on: ubuntu-latest
    # The poll below is bounded at 75 minutes; this is the backstop under it.
    timeout-minutes: 90
    # A fork's pull request gets no secrets, so the run cannot authenticate.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # `changed` diffs against the base, so the base commit has to be here.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Which skills did this branch touch
        id: skills
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          SKILLS=$(bun run scripts/skill-evals.ts changed --base "$BASE_SHA" | paste -sd, -)
          echo "Changed skills: ${SKILLS:-<none>}"
          # A skill is a directory under `.claude/skills/`, so its name comes
          # from the branch. `key=value` output syntax is line-oriented: a name
          # carrying a newline would write every following line as another
          # output of this step. Refuse anything that is not a comma-separated
          # list of the names a directory may actually have.
          case "$SKILLS" in
            "" | *[!A-Za-z0-9,_-]* )
              if [ -n "$SKILLS" ]; then
                echo "::error::refusing an unexpected skill list: $SKILLS"
                exit 1
              fi
              ;;
          esac
          echo "list=$SKILLS" >> "$GITHUB_OUTPUT"

      - name: Every scenario names a real skill
        if: steps.skills.outputs.list != ''
        run: bun run scripts/skill-evals.ts check-names

      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        if: steps.skills.outputs.list != ''
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Narrow the run to those skills' scenarios
        if: steps.skills.outputs.list != ''
        env:
          SKILLS: ${{ steps.skills.outputs.list }}
        run: bun run scripts/skill-evals.ts subset --skills "$SKILLS" --out "$RUNNER_TEMP/scenarios"

      # `--skip-baseline` because the baseline cannot move when only a skill
      # changed, and it is half the solves. `-n 1` because this is the inner
      # loop; a number worth quoting comes from a deliberate `-n 3` run.
      #
      # The model is NOT pinned here. `--model` needs a paid plan, and the
      # scoreboard records whichever model the run reports — `compare` then
      # refuses to show a delta across a model change rather than reading one
      # as a regression.
      - name: Start the eval run
        id: run
        if: steps.skills.outputs.list != ''
        env:
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SKILLS: ${{ steps.skills.outputs.list }}
        working-directory: .claude
        run: |
          OUT=$(tessl eval run "$RUNNER_TEMP/scenarios" \
            --context . \
            --skip-baseline \
            -n 1 \
            --yes \
            --label "PR #${PR_NUMBER} — ${SKILLS}" \
            --json)
          echo "$OUT"
          ID=$(echo "$OUT" | bun -e 'const d=JSON.parse(await Bun.stdin.text()); console.log(d.data?.id ?? d.id ?? "")')
          if [ -z "$ID" ]; then echo "::error::could not read a run id"; exit 1; fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # `tessl eval run` returns as soon as the run is QUEUED, so something has
      # to wait — but not on `status`. That field has read `pending` for over an
      # hour after every solution was scored, which would hang this job until
      # its timeout. `ready` asks the question that matters instead: has every
      # expected variant of every scenario been scored.
      - name: Wait for it to be scored
        if: steps.skills.outputs.list != ''
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
        run: |
          for _ in $(seq 1 75); do
            (cd .claude && tessl eval view "$RUN_ID" --json) > "$RUNNER_TEMP/run.json" || true
            if bun run scripts/skill-evals.ts ready --run "$RUNNER_TEMP/run.json"; then exit 0; fi
            sleep 60
          done
          echo "::error::run was not scored inside 75 minutes"
          exit 1

      - name: Compare against the scoreboard
        id: compare
        if: steps.skills.outputs.list != ''
        run: |
          bun run scripts/skill-evals.ts compare --run "$RUNNER_TEMP/run.json" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md"

      - name: Post the table
        if: steps.skills.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"

      # The scoreboard is what the NEXT run is compared against, so it has to
      # land with the change that produced it. Committing it to the pull
      # request's own branch keeps the delta reviewable in the diff; the path
      # filter above deliberately ignores this file so the push does not
      # trigger another run.
      # Every value below comes from the pull request and is therefore attacker
      # controlled, so each is bound to an environment variable rather than
      # interpolated into the script. `${{ … }}` is substituted into the shell
      # source before bash parses it, and `git check-ref-format` permits `$`,
      # `(`, `)` and backticks in a branch name — so a branch called
      # `x$(curl …)` would have executed here, in a job holding
      # `contents: write` and a checkout-persisted token. `env:` puts the value
      # in the process environment instead, where the shell never re-parses it.
      - name: Record the scores
        if: steps.skills.outputs.list != ''
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          bun run scripts/skill-evals.ts record --run "$RUNNER_TEMP/run.json"
          if git diff --quiet -- .claude/evals/scores.json; then
            echo "Scoreboard unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/evals/scores.json
          git commit -m "chore(evals): record scores for run ${RUN_ID}"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
